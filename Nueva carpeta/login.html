<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de sesión - La Granja</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="card shadow p-4 mt-5">

                    <div class="text-center">
                        <img src="img/logo.png" width="300" alt="Logo La Granja">

                        <h2 class="mt-3">La Granja</h2>

                        <p class="text-muted">
                            Sistema de Trazabilidad e Inventario
                        </p>
                    </div>

                    <form id="formularioLogin">

                        <div class="mb-3">
                            <label for="correo" class="form-label">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                id="correo"
                                class="form-control"
                                placeholder="Ingrese su correo"
                                required>
                        </div>

                        <div class="mb-4">
                            <label for="contrasena" class="form-label">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                id="contrasena"
                                class="form-control"
                                placeholder="Ingrese su contraseña"
                                required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Iniciar Sesión
                        </button>

                    </form>

                </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
