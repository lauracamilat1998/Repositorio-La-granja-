
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Producción - La Granja</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Iconos -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Estilos originales -->
    <link rel="stylesheet" href="css/registrar-produccion.css">
</head>

<body>

    <div class="dashboard">

        <!-- MENÚ LATERAL -->
        <aside class="sidebar">

            <div class="logo-container">
                <img
                    src="img/logo.png"
                    alt="Logo La Granja"
                    class="logo"
                >
            </div>

            <nav class="menu">

                <a href="dashboard.html" class="menu-item">
                    <i class="bi bi-house-door-fill"></i>
                    <span>Dashboard</span>
                </a>

                <a href="inventario.html" class="menu-item">
                    <i class="bi bi-box-seam"></i>
                    <span>Inventario</span>
                </a>

                <a href="registrar-produccion.html" class="menu-item active">
                    <i class="bi bi-cart3"></i>
                    <span>Producción</span>
                </a>

                <a href="trazabilidad.html" class="menu-item">
                    <i class="bi bi-upc-scan"></i>
                    <span>Trazabilidad</span>
                </a>

                <a href="trazabilidad.html" class="menu-item">
                    <i class="bi bi-card-list"></i>
                    <span>Reportes</span>
                </a>

            </nav>

        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">

            <header class="topbar">

                <div class="topbar-icons">
                    <i class="bi bi-bell"></i>
                    <i class="bi bi-person-circle user-icon"></i>

                    <div class="user-info">
                        <strong>Administrador</strong>
                        <small>admin</small>
                    </div>
                </div>

            </header>

            <div class="content">

                <div class="page-title">
                    <h5>Producción &gt; Registrar Producción</h5>
                </div>

                <!-- FORMULARIO -->
                <form id="formProduccion">

                    <div class="row production-form">

                        <!-- DATOS DE PRODUCCIÓN -->
                        <div class="col-md-4">

                            <div class="form-group">
                                <label for="producto">
                                    Producto elaborado<span>*</span>
                                </label>

                                <select id="producto" class="form-select" required>
                                    <option value="">Seleccionar</option>
                                    <option value="Pollo a la plancha">Pollo a la plancha</option>
                                    <option value="Salsa rosada">Salsa rosada</option>
                                    <option value="Bechamel">Bechamel</option>
                                    <option value="Empanadas">Empanadas</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="fecha">
                                    Fecha de producción<span>*</span>
                                </label>

                                <input
                                    type="date"
                                    id="fecha"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <div class="row">

                                <div class="col-6">
                                    <div class="form-group">
                                        <label for="cantidad">
                                            Cantidad producida<span>*</span>
                                        </label>

                                        <input
                                            type="number"
                                            id="cantidad"
                                            class="form-control"
                                            min="0.01"
                                            step="any"
                                            placeholder="Ej. 10"
                                            required
                                        >
                                    </div>
                                </div>

                                <div class="col-6">
                                    <div class="form-group">
                                        <label for="unidad">
                                            Unidad<span>*</span>
                                        </label>

                                        <select id="unidad" class="form-select" required>
                                            <option value="">Seleccionar</option>
                                            <option value="Kg">Kg</option>
                                            <option value="Litros">Litros</option>
                                            <option value="Unidades">Unidades</option>
                                        </select>
                                    </div>
                                </div>

                            </div>

                            <div class="form-group">
                                <label for="responsable">
                                    Responsable<span>*</span>
                                </label>

                                <select id="responsable" class="form-select" required>
                                    <option value="">Seleccionar responsable</option>
                                    <option value="Administrador">Administrador</option>
                                    <option value="Chef">Chef</option>
                                    <option value="Auxiliar de cocina">Auxiliar de cocina</option>
                                </select>
                            </div>

                        </div>

                        <!-- INGREDIENTES -->
                        <div class="col-md-7 offset-md-1">

                            <div class="ingredients-box">

                                <div class="ingredients-title">
                                    Ingredientes utilizados
                                </div>

                                <div class="table-responsive">
                                    <table class="table ingredients-table">

                                        <thead>
                                            <tr>
                                                <th>Ingredientes</th>
                                                <th>Cantidad</th>
                                                <th>Unidad</th>
                                                <th>Acciones</th>
                                            </tr>
                                        </thead>

                                        <tbody id="tablaIngredientes">

                                            <tr>
                                                <td>
                                                    <input
                                                        type="text"
                                                        class="form-control"
                                                        value="Pollo Pechuga"
                                                        placeholder="Ingrediente"
                                                        required
                                                    >
                                                </td>

                                                <td>
                                                    <input
                                                        type="number"
                                                        class="form-control"
                                                        value="5"
                                                        min="0.01"
                                                        step="any"
                                                        required
                                                    >
                                                </td>

                                                <td>
                                                    <select class="form-select" required>
                                                        <option value="Kg" selected>Kg</option>
                                                        <option value="Gramos">Gramos</option>
                                                        <option value="Litros">Litros</option>
                                                        <option value="Mililitros">Mililitros</option>
                                                        <option value="Unidades">Unidades</option>
                                                    </select>
                                                </td>

                                                <td>
                                                    <button
                                                        type="button"
                                                        class="btn-eliminar"
                                                        aria-label="Eliminar ingrediente"
                                                        title="Eliminar ingrediente"
                                                    >
                                                        <i class="bi bi-trash3"></i>
                                                    </button>
                                                </td>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <input
                                                        type="text"
                                                        class="form-control"
                                                        value="Tomate"
                                                        placeholder="Ingrediente"
                                                        required
                                                    >
                                                </td>

                                                <td>
                                                    <input
                                                        type="number"
                                                        class="form-control"
                                                        value="2"
                                                        min="0.01"
                                                        step="any"
                                                        required
                                                    >
                                                </td>

                                                <td>
                                                    <select class="form-select" required>
                                                        <option value="Kg" selected>Kg</option>
                                                        <option value="Gramos">Gramos</option>
                                                        <option value="Litros">Litros</option>
                                                        <option value="Mililitros">Mililitros</option>
                                                        <option value="Unidades">Unidades</option>
                                                    </select>
                                                </td>

                                                <td>
                                                    <button
                                                        type="button"
                                                        class="btn-eliminar"
                                                        aria-label="Eliminar ingrediente"
                                                        title="Eliminar ingrediente"
                                                    >
                                                        <i class="bi bi-trash3"></i>
                                                    </button>
                                                </td>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <input
                                                        type="text"
                                                        class="form-control"
                                                        value="Cebolla"
                                                        placeholder="Ingrediente"
                                                        required
                                                    >
                                                </td>

                                                <td>
                                                    <input
                                                        type="number"
                                                        class="form-control"
                                                        value="1"
                                                        min="0.01"
                                                        step="any"
                                                        required
                                                    >
                                                </td>

                                                <td>
                                                    <select class="form-select" required>
                                                        <option value="Kg" selected>Kg</option>
                                                        <option value="Gramos">Gramos</option>
                                                        <option value="Litros">Litros</option>
                                                        <option value="Mililitros">Mililitros</option>
                                                        <option value="Unidades">Unidades</option>
                                                    </select>
                                                </td>

                                                <td>
                                                    <button
                                                        type="button"
                                                        class="btn-eliminar"
                                                        aria-label="Eliminar ingrediente"
                                                        title="Eliminar ingrediente"
                                                    >
                                                        <i class="bi bi-trash3"></i>
                                                    </button>
                                                </td>
                                            </tr>

                                        </tbody>

                                    </table>
                                </div>

                                <button
                                    type="button"
                                    class="add-ingredient"
                                    id="agregarIngrediente"
                                >
                                    <i class="bi bi-plus-square"></i>
                                    Agregar Ingrediente
                                </button>

                            </div>

                        </div>

                    </div>

                    <!-- OBSERVACIONES -->
                    <div class="observations">

                        <label for="observaciones">
                            Observaciones
                        </label>

                        <textarea
                            id="observaciones"
                            class="form-control"
                            placeholder="Escribe alguna observación (Opcional)"
                        ></textarea>

                    </div>

                    <!-- BOTONES -->
                    <div class="buttons">

                        <button
                            type="button"
                            class="btn cancel"
                            id="cancelar"
                        >
                            Cancelar
                        </button>

                        <button
                            type="submit"
                            class="btn save"
                        >
                            Registrar Producción
                        </button>

                    </div>

                </form>

            </div>

        </main>

    </div>

    <!-- FUNCIONES DE LA PANTALLA -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const formulario = document.getElementById("formProduccion");
            const tabla = document.getElementById("tablaIngredientes");
            const botonAgregar = document.getElementById("agregarIngrediente");
            const botonCancelar = document.getElementById("cancelar");

            // Agregar una nueva fila de ingredientes
            botonAgregar.addEventListener("click", function () {

                const fila = document.createElement("tr");

                fila.innerHTML = `
                    <td>
                        <input
                            type="text"
                            class="form-control"
                            placeholder="Ingrediente"
                            required
                        >
                    </td>

                    <td>
                        <input
                            type="number"
                            class="form-control"
                            min="0.01"
                            step="any"
                            placeholder="Cantidad"
                            required
                        >
                    </td>

                    <td>
                        <select class="form-select" required>
                            <option value="">Unidad</option>
                            <option value="Kg">Kg</option>
                            <option value="Gramos">Gramos</option>
                            <option value="Litros">Litros</option>
                            <option value="Mililitros">Mililitros</option>
                            <option value="Unidades">Unidades</option>
                        </select>
                    </td>

                    <td>
                        <button
                            type="button"
                            class="btn-eliminar"
                            aria-label="Eliminar ingrediente"
                            title="Eliminar ingrediente"
                        >
                            <i class="bi bi-trash3"></i>
                        </button>
                    </td>
                `;

                tabla.appendChild(fila);
            });

            // Eliminar una fila de ingredientes
            tabla.addEventListener("click", function (evento) {

                const boton = evento.target.closest(".btn-eliminar");

                if (boton) {
                    boton.closest("tr").remove();
                }
            });

            // Cancelar y regresar al dashboard
            botonCancelar.addEventListener("click", function () {

                const confirmar = confirm(
                    "¿Deseas cancelar el registro de producción?"
                );

                if (confirmar) {
                    window.location.href = "dashboard.html";
                }
            });

            // Validar y mostrar confirmación
            formulario.addEventListener("submit", function (evento) {

                evento.preventDefault();

                if (!formulario.checkValidity()) {
                    formulario.reportValidity();
                    return;
                }

                if (tabla.querySelectorAll("tr").length === 0) {
                    alert("Debes registrar al menos un ingrediente.");
                    return;
                }

                const ingredientes = tabla.querySelectorAll("tr");

                for (const fila of ingredientes) {

                    const nombre = fila.querySelector('input[type="text"]').value.trim();
                    const cantidad = Number(
                        fila.querySelector('input[type="number"]').value
                    );

                    if (!nombre || !Number.isFinite(cantidad) || cantidad <= 0) {
                        alert("Verifica que todos los ingredientes tengan nombre y cantidad válida.");
                        return;
                    }
                }

                const producto = document.getElementById("producto").value;
                const cantidadProducida = document.getElementById("cantidad").value;
                const unidad = document.getElementById("unidad").value;

                alert(
                    "¡Producción validada correctamente!\n\n" +
                    "Producto: " + producto + "\n" +
                    "Cantidad producida: " + cantidadProducida + " " + unidad + "\n" +
                    "Ingredientes registrados: " + ingredientes.length + "\n\n" +
                    "Este prototipo todavía no guarda los datos en una base de datos."
                );

            });

        });
    </script>

</body>
</html>
